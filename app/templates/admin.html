<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <style>
      :root {
        --bg: #071a2e;
        --panel: #0f233d;
        --panel-2: #133153;
        --text: #edf4ff;
        --muted: #afd0f6;
        --accent: #6ae6d0;
        --accent-2: #89b6ff;
        --warn: #ffd166;
        --border: rgba(255,255,255,0.1);
      }
      body {
        margin: 0;
        font-family: Inter, Arial, sans-serif;
        background: linear-gradient(135deg, #060d1a, #0a1d33 56%, #122b46);
        color: var(--text);
      }
      .shell {
        max-width: 1200px;
        margin: 0 auto;
        padding: 48px 20px 100px;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 26px;
      }
      .brand {
        font-size: 1.4rem;
        font-weight: 700;
      }
      .link {
        color: var(--accent);
        text-decoration: none;
      }
      .grid {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 22px;
      }
      .panel {
        background: rgba(13, 28, 48, 0.92);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 24px;
        box-shadow: 0 18px 50px rgba(0,0,0,0.2);
      }
      h1 {
        margin: 0 0 8px;
        font-size: clamp(2rem, 3vw, 3rem);
      }
      .subtitle {
        color: var(--muted);
        margin: 0 0 24px;
        line-height: 1.7;
      }
      form {
        display: grid;
        gap: 16px;
      }
      .row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }
      label {
        display: grid;
        gap: 8px;
        color: var(--muted);
        font-size: 0.92rem;
      }
      input, select, textarea, button {
        border-radius: 12px;
        border: 1px solid var(--border);
        font: inherit;
      }
      input, select, textarea {
        background: rgba(255,255,255,0.02);
        color: var(--text);
        padding: 12px 14px;
      }
      textarea {
        min-height: 120px;
        resize: vertical;
      }
      button {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #081722;
        font-weight: 800;
        padding: 14px 18px;
        border: none;
        cursor: pointer;
      }
      .stats {
        display: grid;
        gap: 14px;
      }
      .stat-box {
        padding: 18px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: rgba(255,255,255,0.02);
      }
      .stat-box strong {
        display: block;
        font-size: 2rem;
        margin-top: 8px;
      }
      .muted {
        color: var(--muted);
      }
      @media (max-width: 900px) {
        .grid, .row { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="topbar">
        <div class="brand">BHASHA SETU</div>
        <a class="link" href="/">Home</a>
      </div>

      <div class="grid">
        <section class="panel">
          <h1>Dataset validation</h1>
          <p class="subtitle">Teacher-in-the-loop collection for Santali, Mundari, and Ho with FLN-aligned sentence pairs.</p>

          <form id="dataset-form">
            <div class="row">
              <label>
                Source language
                <select id="source_language" name="source_language">
                  <option value="hi">Hindi</option>
                  <option value="sat">Santali</option>
                  <option value="mun">Mundari</option>
                  <option value="ho">Ho</option>
                </select>
              </label>
              <label>
                Target language
                <select id="target_language" name="target_language">
                  <option value="sat">Santali</option>
                  <option value="mun">Mundari</option>
                  <option value="ho">Ho</option>
                </select>
              </label>
            </div>

            <div class="row">
              <label>
                Domain
                <select id="domain" name="domain">
                  <option value="mathematics">Mathematics</option>
                  <option value="fln">FLN</option>
                  <option value="classroom">Classroom</option>
                  <option value="stories">Stories</option>
                  <option value="general">General</option>
                </select>
              </label>
              <label>
                Validated
                <select id="validated" name="validated">
                  <option value="true">Yes</option>
                  <option value="false">No</option>
                </select>
              </label>
            </div>

            <label>
              Hindi / source sentence
              <textarea id="source_text" placeholder="Enter source sentence in Hindi or base language...">दो और तीन का योग क्या है?</textarea>
            </label>

            <label>
              Tribal-language translation
              <textarea id="target_text" placeholder="Enter validated translation for Santali, Mundari, or Ho...">ᱟᱨᱡᱚᱜ ᱟᱨ ᱛᱤᱱᱤ ᱠᱚ ᱫᱟᱨ ᱠᱟᱱᱟ?</textarea>
            </label>

            <button type="submit">Submit validated dataset entry</button>
          </form>
        </section>

        <aside class="panel">
          <h2>Dataset overview</h2>
          <div class="stats">
            <div class="stat-box">
              <div class="muted">Total entries</div>
              <strong id="total_entries">0</strong>
            </div>
            <div class="stat-box">
              <div class="muted">Validated entries</div>
              <strong id="validated_entries">0</strong>
            </div>
            <div class="stat-box">
              <div class="muted">Target languages</div>
              <strong id="language_summary">0</strong>
            </div>
          </div>
        </aside>
      </div>
    </div>

    <script>
      async function loadStats() {
        const res = await fetch('/api/dataset/stats');
        const data = await res.json();
        document.getElementById('total_entries').textContent = data.total_entries || 0;
        document.getElementById('validated_entries').textContent = data.validated_entries || 0;
        document.getElementById('language_summary').textContent = Object.keys(data.by_language || {}).length;
      }

      document.getElementById('dataset-form').addEventListener('submit', async function (event) {
        event.preventDefault();
        const payload = {
          source_language: document.getElementById('source_language').value,
          target_language: document.getElementById('target_language').value,
          domain: document.getElementById('domain').value,
          source_text: document.getElementById('source_text').value,
          target_text: document.getElementById('target_text').value,
          validated: document.getElementById('validated').value === 'true'
        };

        const response = await fetch('/api/dataset/entries', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          alert('Dataset entry submitted successfully.');
          document.getElementById('dataset-form').reset();
          await loadStats();
        } else {
          alert('Submission failed. Please check the form values.');
        }
      });

      loadStats();
    </script>
  </body>
</html>
